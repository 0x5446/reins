name: Feature request
description: Something Reins should be able to do and cannot.
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Two lists are worth checking first, both in `docs/architecture.md`:

        - **§17, "明确不做"** — things that are deliberately absent, each with the
          reason. Managing workspaces, installing plugins, and writing API keys
          from a phone are on it. A request to add one of those is not
          unwelcome, but it has to argue with the reason.
        - **§18** — the known costs, each with a written trigger for
          reconsidering it. One phone talks to one Mac at a time; the protocol
          is tied to the DeepSeek Harness; there is no Android app. If your
          request is really one of these, saying so is more useful than a
          feature title.

        The documents are in Chinese. If that is in the way, describe what you
        want and it can be checked for you.

  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do
      description: |
        The situation, not the feature. "I want to change the model mid-turn" is
        a feature; "the agent picked the wrong model and I had to walk back to my
        desk" is the thing that can be solved more than one way.
    validations:
      required: true

  - type: textarea
    id: today
    attributes:
      label: What you do about it today
      description: Including "nothing, I give up and wait until I am at the Mac".

  - type: input
    id: prior
    attributes:
      label: Is it already listed as not-doing or as a known gap
      description: Section number from `docs/architecture.md` if you found one.
