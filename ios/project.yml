name: Reins
options:
  bundleIdPrefix: ai.novabox
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    # Overridable from the environment so a different machine, or CI, does not
    # have to edit a tracked file to build. Empty means simulator only.
    DEVELOPMENT_TEAM: ${REINS_TEAM_ID}
    CODE_SIGN_STYLE: Automatic
    SWIFT_STRICT_CONCURRENCY: minimal
    ENABLE_USER_SCRIPT_SANDBOXING: YES

targets:
  Reins:
    type: application
    platform: iOS
    sources:
      - path: Reins
    settings:
      base:
        # Reverse of a domain that is actually owned, so it cannot collide with
        # someone else's App Store record.
        PRODUCT_BUNDLE_IDENTIFIER: ai.novabox.reins
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_ENTITLEMENTS: Reins/Reins.entitlements
        # iPhone only. The layout is one portrait column and has never been
        # anything else, and claiming the iPad idiom costs three things for no
        # gain: App Store Connect starts demanding a set of 13" iPad
        # screenshots, App Review runs the app on hardware it was not drawn
        # for, and the iPad multitasking rule requires all four orientations —
        # the escape hatch for which, UIRequiresFullScreen, Apple has
        # deprecated (TN3192). Dropping to family 1 settles all three, and an
        # iPhone-only app still installs on iPad in compatibility mode.
        TARGETED_DEVICE_FAMILY: "1"
    # Every key below lives here rather than in `settings.base` as an
    # INFOPLIST_KEY_* entry. Those settings are only consulted when Xcode
    # *generates* the Info.plist; this target ships an explicit one
    # (GENERATE_INFOPLIST_FILE = NO), so an INFOPLIST_KEY_* is evaluated,
    # printed by -showBuildSettings, and then silently dropped on the floor.
    # Six of them were, including three purpose strings the app cannot run
    # without.
    info:
      path: Reins/Info.plist
      properties:
        CFBundleDisplayName: Reins
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        # One column, one orientation. Stated rather than left to the default,
        # which is portrait *plus* both landscapes on iPhone.
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        # Purpose strings. Each of these is load-bearing: iOS does not fail a
        # missing one politely, it terminates the process (Termination Reason:
        # Namespace TCC) the first time the matching API is touched.
        #
        # Camera — scanning the Mac's pairing QR is the fast path onto a
        # machine, and ScannerView calls AVCaptureDevice.requestAccess.
        NSCameraUsageDescription: Reins uses the camera to scan the pairing code your Mac shows.
        # Face ID — AppLock calls LAContext.canEvaluatePolicy, which since
        # iOS 17 is itself enough to trip the check, before any prompt appears.
        NSFaceIDUsageDescription: Reins can ask for Face ID before showing your conversations, so a found phone does not open them.
        # Photos — the composer's PhotosPicker runs out of process and would
        # work without this, but the app does put library images into a
        # message, and the honest declaration costs nothing.
        NSPhotoLibraryUsageDescription: Reins attaches photos you pick to a message.
        # Local network — direct LAN connections skip the relay entirely.
        # Apple's TN3179 lists "making an outgoing TCP connection" as
        # requiring this, Bonjour or not, and since iOS 18 the consent prompt
        # does not even appear without the string: the connection just fails
        # as NSURLErrorNotConnectedToInternet (-1009) with an underlying
        # "Local network prohibited". That is the whole fast path, silently.
        NSLocalNetworkUsageDescription: Reins connects straight to your Mac when both are on the same Wi-Fi, which is faster and never leaves your network.
        # Declared true because it is true. The app implements Noise over
        # CryptoKit — Curve25519 and ChaCha20-Poly1305 — to encrypt what a
        # person types to their own machine, which is not any of the exemptions
        # Apple lists: not medical, not authentication-only, not copy
        # protection, not under 56-bit. Answering false here would be a false
        # statement on an export declaration to save one question per upload.
        #
        # What it costs: App Store Connect asks once per app whether the
        # encryption is self-classified as mass market (ECCN 5D992.c), which
        # this is. Nothing blocks a build.
        #
        # It does *not* carry an annual self-classification report, which an
        # earlier version of this comment claimed. BIS narrowed that in the
        # rule effective 2021-03-29: mass market 5A992.c / 5D992.c items sit
        # under License Exception ENC (b)(1) and no longer report annually.
        # What still reports is the hardware side — chips, chipsets, electronic
        # assemblies, field-programmable logic devices — and software
        # classified 5D002. An end-user application is none of those.
        #
        # What it does cost is one form: every primitive here comes from
        # CryptoKit, but the Noise state machine on top is ours, so the App
        # Store Connect questionnaire lands on "standard algorithms in addition
        # to the operating system's", and that asks for a French encryption
        # declaration to ship in France. Apple wants the filled form, not
        # ANSSI's reply. No CCATS: that is only for cryptography that is both
        # unstandardised *and* unpublished, and Noise is published.
        #
        # Keeping every primitive on CryptoKit is therefore worth defending.
        # Bundling libsodium or a Rust Noise implementation would change none
        # of the cryptography and still make the export answer worse.
        ITSAppUsesNonExemptEncryption: true
        CFBundleURLTypes:
          - CFBundleURLName: ai.novabox.reins.pair
            CFBundleURLSchemes:
              - reins
        NSAppTransportSecurity:
          # Direct connections are plain WebSocket over the local network,
          # carrying nothing but Noise ciphertext — TLS underneath would
          # authenticate a name no one can issue a certificate for. The
          # exception is scoped to local addresses; the relay stays wss.
          NSAllowsLocalNetworking: true

  ReinsTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: ReinsTests
    dependencies:
      - target: Reins
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ai.novabox.reins.tests
        GENERATE_INFOPLIST_FILE: YES
        # Tests run on the simulator, which needs no team and no profile.
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGNING_ALLOWED: NO

  ReinsUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: ReinsUITests
    dependencies:
      - target: Reins
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ai.novabox.reins.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Reins

schemes:
  Reins:
    build:
      targets:
        Reins: all
        ReinsTests: [test]
        ReinsUITests: [test]
    test:
      targets:
        - ReinsTests
      gatherCoverageData: false

  # Separate scheme: the unit tests run anywhere in seconds, the UI tests need a
  # paired Bridle and take minutes. Keeping them in one scheme would mean every
  # `npm run test:ios` waits on a machine that may not be running.
  ReinsUI:
    build:
      targets:
        Reins: all
        ReinsUITests: [test]
    test:
      targets:
        - ReinsUITests
      gatherCoverageData: false
    run:
      config: Debug
