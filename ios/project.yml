name: Reins
options:
  bundleIdPrefix: ai.novabox
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    # Overridable from the environment so a different machine, or CI, does not
    # have to edit a tracked file to build. Empty means simulator only.
    DEVELOPMENT_TEAM: ${REINS_TEAM_ID}
    CODE_SIGN_STYLE: Automatic
    SWIFT_STRICT_CONCURRENCY: minimal
    ENABLE_USER_SCRIPT_SANDBOXING: YES

targets:
  Reins:
    type: application
    platform: iOS
    sources:
      - path: Reins
    settings:
      base:
        # Reverse of a domain that is actually owned, so it cannot collide with
        # someone else's App Store record.
        PRODUCT_BUNDLE_IDENTIFIER: ai.novabox.reins
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_ENTITLEMENTS: Reins/Reins.entitlements
        INFOPLIST_KEY_CFBundleDisplayName: Reins
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UIUserInterfaceStyle: Automatic
        # Scanning the Mac's pairing QR is the fast path onto a machine; the
        # string is what iOS shows in the permission sheet, so it says why.
        INFOPLIST_KEY_NSCameraUsageDescription: Reins uses the camera to scan the pairing code your Mac shows.
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: Reins attaches photos you pick to a message.
        # Direct LAN connections skip the relay entirely. iOS gates any local
        # network traffic behind this prompt.
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: Reins connects straight to your Mac when both are on the same Wi-Fi, which is faster and never leaves your network.
    info:
      path: Reins/Info.plist
      properties:
        CFBundleDisplayName: Reins
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UIBackgroundModes:
          - remote-notification
        CFBundleURLTypes:
          - CFBundleURLName: ai.novabox.reins.pair
            CFBundleURLSchemes:
              - reins
        NSAppTransportSecurity:
          # Direct connections are plain WebSocket over the local network,
          # carrying nothing but Noise ciphertext — TLS underneath would
          # authenticate a name no one can issue a certificate for. The
          # exception is scoped to local addresses; the relay stays wss.
          NSAllowsLocalNetworking: true

  ReinsTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: ReinsTests
    dependencies:
      - target: Reins
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ai.novabox.reins.tests
        GENERATE_INFOPLIST_FILE: YES
        # Tests run on the simulator, which needs no team and no profile.
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGNING_ALLOWED: NO

  ReinsUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: ReinsUITests
    dependencies:
      - target: Reins
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ai.novabox.reins.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Reins

schemes:
  Reins:
    build:
      targets:
        Reins: all
        ReinsTests: [test]
        ReinsUITests: [test]
    test:
      targets:
        - ReinsTests
      gatherCoverageData: false

  # Separate scheme: the unit tests run anywhere in seconds, the UI tests need a
  # paired Bridle and take minutes. Keeping them in one scheme would mean every
  # `npm run test:ios` waits on a machine that may not be running.
  ReinsUI:
    build:
      targets:
        Reins: all
        ReinsUITests: [test]
    test:
      targets:
        - ReinsUITests
      gatherCoverageData: false
    run:
      config: Debug
